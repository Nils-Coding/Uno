[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uno-kartenspiel-ui"
version = "0.1.0"
description = "Objektorientiertes UNO mit grafischer Oberfläche"
requires-python = ">=3.11"
dependencies = ["pygame-ce>=2.5.7,<3"]

[project.scripts]
uno-ui = "Kartenspiel.ui:main"

[tool.setuptools.packages.find]
include = ["Kartenspiel*"]

[tool.setuptools.package-data]
"Kartenspiel.ui" = ["assets/*.png"]
